  #winTime{font-size:22px;font-weight:600;margin-bottom:6px}

  .edrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:#e2e8f0}
  .edrow .chips button{font-size:12px;padding:5px 10px}
  #edCv{cursor:grab}
  /* --- spacing pass --- */
  .card{padding:20px 22px}
  .langs{gap:8px;margin:4px 0 14px}
  .chips{gap:8px}
  .chips button,.langs button{padding:7px 13px}
  .top{gap:16px}
  label.l{margin:16px 0 8px}
  .tcol label.l:first-child{margin-top:0}
  #invInfo{margin-top:8px!important;line-height:1.55}
  .crow{margin:9px 0;gap:10px}
  .sws{gap:6px}
  #colorRows{margin-top:6px}
  .play{margin-top:20px}
  .sec{margin-top:10px}

  .info{margin-top:14px}

</style>

function wrapLines(x,text,maxW){
  const out=[];
  text.split("\n").forEach(par=>{const words=par.split(" ");let line="";
    words.forEach(w=>{const test=line?line+" "+w:w;if(x.measureText(test).width>maxW&&line){out.push(line);line=w;}else line=test;});
    out.push(line);});
  return out;
}

const HW=0.45,PH=2.7,GRAV=34,JUMP=12.8,SPEED=8.2,STEPUP=0.55;
function newBody(x,y,z){return {x,y,z,vx:0,vy:0,vz:0,kx:0,kz:0,grounded:false,coyote:0,groundBox:null};}
function overlap(b,x,y,z){return x+HW>b.min[0]&&x-HW<b.max[0]&&y+PH>b.min[1]&&y<b.max[1]&&z+HW>b.min[2]&&z-HW<b.max[2];}
function isSolid(b){return b.type!=="kill"&&b.type!=="lava";}
function approach(v,tg,d){return v<tg?Math.min(tg,v+d):Math.max(tg,v-d);}
function bodyStep(b,dt,wx,wz,jumpNow,held,speed){
  const acc=b.grounded?60:22;
  b.vx=approach(b.vx,wx*speed,acc*dt);b.vz=approach(b.vz,wz*speed,acc*dt);
  const kd=Math.exp(-(b.grounded?7:2.2)*dt);b.kx*=kd;b.kz*=kd;
  b.coyote-=dt;if(b.grounded)b.coyote=0.1;
  let jumped=false;
  if(jumpNow&&b.coyote>0){b.vy=JUMP;b.coyote=0;b.grounded=false;jumped=true;}
  if(!held&&b.vy>4)b.vy-=GRAV*1.6*dt;
  b.vy-=GRAV*(b.vy<0?1.5:1)*dt;if(b.vy<-55)b.vy=-55;
  const N=near(b.z);const prevY=b.y,wasG=b.grounded,vyB=b.vy;
  b.y+=b.vy*dt;b.grounded=false;b.groundBox=null;
  for(const L of N)for(const o of L){if(!isSolid(o)||!overlap(o,b.x,b.y,b.z))continue;
    if(b.vy<=0&&prevY>=o.max[1]-0.05){b.y=o.max[1];b.vy=0;b.grounded=true;b.groundBox=o;}
    else if(b.vy>0&&prevY+PH<=o.min[1]+0.05){b.y=o.min[1]-PH;b.vy=0;}}
  b.x+=(b.vx+b.kx)*dt;
  for(const L of N)for(const o of L){if(!isSolid(o)||!overlap(o,b.x,b.y,b.z))continue;
    if(o.max[1]-b.y<STEPUP&&b.grounded){b.y=o.max[1];continue;}
    if(b.vx+b.kx>0)b.x=o.min[0]-HW-0.001;else b.x=o.max[0]+HW+0.001;b.vx=0;b.kx=0;}
  b.z+=(b.vz+b.kz)*dt;
  const N2=near(b.z);
  for(const L of N2)for(const o of L){if(!isSolid(o)||!overlap(o,b.x,b.y,b.z))continue;
    if(o.max[1]-b.y<STEPUP&&b.grounded){b.y=o.max[1];continue;}
    if(b.vz+b.kz>0)b.z=o.min[2]-HW-0.001;else b.z=o.max[2]+HW+0.001;b.vz=0;b.kz=0;}
  if(b.grounded&&b.groundBox&&b.groundBox.belt)b.z+=b.groundBox.belt*dt;
  for(const L of N2)for(const o of L){if(!isSolid(o)&&overlap(o,b.x,b.y+0.05,b.z))return {die:true,jumped};}
  return {jumped,landed:!wasG&&b.grounded,impact:vyB};
}
function groundBelow(x,y,z){
  for(const L of near(z))for(const o of L){if(!isSolid(o))continue;
    if(x>=o.min[0]&&x<=o.max[0]&&z>=o.min[2]&&z<=o.max[2]&&o.max[1]<=y+0.3&&o.max[1]>=y-1.5)return true;}
  return false;
}
function killNear(x,y,z){
  for(const L of near(z))for(const o of L){if(o.type!=="kill")continue;
    if(x+0.35>o.min[0]&&x-0.35<o.max[0]&&z+0.35>o.min[2]&&z-0.35<o.max[2]&&y+1>o.min[1]&&y<o.max[1])return true;}
  return false;
}
function blockAhead(x,y,z){
  for(const L of near(z))for(const o of L){if(!isSolid(o))continue;
    if(x+0.3>o.min[0]&&x-0.3<o.max[0]&&z+0.3>o.min[2]&&z-0.3<o.max[2]&&o.max[1]-y>STEPUP&&o.max[1]-y<1.6&&o.min[1]<y+1)return true;}
  return false;
}

const meChar=new Character(look,"me");
let playing=false,paused=false,pauseT0=0,startT=0,elapsed=0;
let savedCp=Math.max(0,Math.min(NSTAGE,parseInt(load("ezobby_cp")||"0",10)||0));
let pts=Math.max(0,parseInt(load("ezobby_pts")||"0",10)||0);
let ptsTimer=0;
function addPts(n){
  pts+=n;store("ezobby_pts",String(pts));
  const el=document.getElementById("ptsPop");el.textContent="+"+n+" ⭐";el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
  clearTimeout(ptsTimer);ptsTimer=setTimeout(()=>el.classList.remove("show"),900);
  sendState(true);
}
function spawnAt(i){me.zip=null;const c=cps[i];me.x=c.x;me.y=c.y+0.05;me.z=c.z-1;me.vx=me.vy=me.vz=me.kx=me.kz=0;me.rot=0;me.lastSafe={x:me.x,y:c.y,z:me.z};
  if(me.ride){me.ride.ride=false;me.ride=null;}
  if(i===MATH_STAGE||i===RIDDLE_STAGE)resetGates(i);
  if(i<=BOULDER_STAGE)boulderReset();
  teacherReset();}
spawnAt(0);
function die(kind){
  if(mode==="tab"){tabRespawn();return;}
  if((kind===undefined||kind==="fell")&&tryAngel())return;
  const k=kind==="squash"?"squash":kind==="ruler"?"ruler":"fell";
  toast(t(k),1300,true);Snd.play(kind==="squash"||kind==="ruler"?"squash":"die");if(kind==="ruler")setTimeout(()=>Snd.play("laugh"),250);
  spawnAt(me.cp);
}
function setFlag(i){for(let s=1;s<flags.length;s++){if(flags[s])flags[s].fm.color.set(s<=i?0x22c55e:0x9ca3af);}}
setFlag(0);
// nomes de evento padronizados com os outros jogos Jatobá Tec (game_start, game_end, level_complete…)
const EV_MAP={ez_play:"game_start",ez_finish:"game_end",ez_stage:"level_complete",ez_pwa_installed:"app_installed",ez_room_create:"room_create",ez_room_join:"room_join"};
function track(ev,params){TRK(EV_MAP[ev]||ev,params);}
function reachCp(i,silent){if(!silent&&mode==="atk"&&i>0)track("ez_stage",{stage:i,stage_name:stageKey[i]||"",difficulty:SPEC.diff==null?1:SPEC.diff});
  me.cp=i;setFlag(i);
  if(!silent){toast(t("cp"));Snd.play("cp");addPts(100);}
  if(i>=1&&!startT){startT=performance.now();}

  updateSkip();sendState(true);
}
function resetCoins(){coins.forEach(c=>{c.got=false;c.m.visible=true;});}

/* ================= quiz gates ================= */
function checkGate(gb){
  const g=gates[gb.gate];if(!g)return;
  if(gb.k===g.correct){
    if(!g.solved){g.solved=true;gb.mesh.material=getMat(0x22c55e);drawGate(g);toast(t("ok"),1200,true);Snd.play("ok");addPts(g.type==="math"?50:100);}
  }else{
    Snd.play("wrong");toast(t("wrong"),1500);
    me.x=g.q.x;me.y=g.q.y+0.05;me.z=g.q.z;me.vx=me.vy=me.vz=me.kx=me.kz=0;
    newQuestion(g);
  }
}

/* ================= boulder ================= */
function boulderReset(){boulder.state="idle";boulder.passed=false;if(boulder.mesh)boulder.mesh.visible=false;Snd.rumble(false);}
function updateBoulder(dt){
  const B=boulder;if(!B.mesh)return;
  if(B.state==="idle"){
    if(playing&&me.cp===BOULDER_STAGE&&!B.passed&&me.z>B.trig&&me.z<B.end){B.state="roll";B.z=B.z0;B.y=cps[BOULDER_STAGE].y+B.r;B.v=4;B.mesh.visible=true;Snd.rumble(true);}
    return;
  }
  if(B.state==="roll"){
    B.v=Math.min(7.1,B.v+dt*2.2);B.z+=B.v*dt;
    B.mesh.position.set(B.x,B.y+Math.abs(Math.sin(B.z*0.9))*0.15,B.z);B.mesh.rotation.x+=B.v*dt/B.r;
    if(me.z>B.end+2)B.passed=true;
    const dz=me.z-B.z;
    if(!B.passed&&Math.abs(me.x-B.x)<B.r+0.3&&dz<B.r+0.4&&dz>-B.r&&me.y<B.y+B.r){die("squash");return;}
    if(B.z>B.end+1)B.state="fall";
    const shake=Math.max(0,1-Math.abs(dz)/25)*0.12;camera.position.x+=(Math.random()-0.5)*shake;camera.position.y+=(Math.random()-0.5)*shake;
  }else if(B.state==="fall"){
    B.z+=B.v*dt;B.y-=dt*14;B.mesh.position.set(B.x,B.y,B.z);B.mesh.rotation.x+=B.v*dt/B.r;
    if(B.y<cps[BOULDER_STAGE].y-30){B.mesh.visible=false;B.state="done";Snd.rumble(false);}
  }
}

/* ================= giant teacher ================= */
function teacherReset(){if(!TCH.root)return;TCH.phase="idle";TCH.t=0;TCH.ang=RAISED;TCH.warn.visible=false;}
function updateTeacher(dt){
  if(!TCH.root)return;
  const active=playing&&me.cp===TEACHER_STAGE&&me.z>TCH.z0-5&&me.z<TCH.z1+1;
  const target=Math.max(TCH.z0+1,Math.min(TCH.z1-1,me.z+me.vz*0.45));
  TCH.t+=dt;
  if(TCH.phase==="idle"){TCH.tz+=(target-TCH.tz)*Math.min(1,dt*3);TCH.ang=RAISED;if(active&&TCH.t>0.45){TCH.phase="warn";TCH.t=0;TCH.hitZ=target;}}
  else if(TCH.phase==="warn"){TCH.tz+=(TCH.hitZ-TCH.tz)*Math.min(1,dt*10);TCH.warn.visible=Math.floor(TCH.t*8)%2===0;TCH.warn.position.z=TCH.hitZ;
    if(TCH.t>0.8){TCH.phase="slam";TCH.t=0;TCH.warn.visible=false;TCH.tz=TCH.hitZ;}}
  else if(TCH.phase==="slam"){TCH.ang=RAISED*(1-Math.min(1,TCH.t/0.12));
    if(TCH.t>=0.12){TCH.ang=0;TCH.phase="hold";TCH.t=0;Snd.play("slap");teacherHit();}}
  else if(TCH.phase==="hold"){if(TCH.t>0.45){TCH.phase="lift";TCH.t=0;}}
  else if(TCH.phase==="lift"){TCH.ang=RAISED*Math.min(1,TCH.t/0.5);if(TCH.t>0.5){TCH.phase="idle";TCH.t=0;}}
  TCH.root.position.z=TCH.tz;TCH.pivot.position.z=TCH.tz;TCH.pivot.rotation.z=TCH.ang;
  const f=1-TCH.ang/RAISED;TCH.av.armL.rotation.x=TCH.av.armR.rotation.x=-2.9+f*2.0;
  TCH.av.body.rotation.x=f*0.18;
}
function inRuler(x,y,z){const d=(x-TCH.x)*(TCH.side||1);return Math.abs(z-TCH.hitZ)<1.05&&d>-5.6&&d<4.2&&y<TCH.y+1.6;}
function teacherHit(){
  const d=Math.abs(me.z-TCH.hitZ);
  if(d<10){camera.position.y+=0.25;}
  if(playing&&inRuler(me.x,me.y,me.z))die("ruler");
  for(const b of bots)if(b.active&&inRuler(b.body.x,b.body.y,b.body.z)){b.ch.say("😵");botPlaceAt(b,b.lastWp);}
}

/* ================= bots ================= */
const BOTNAMES=["Zeca","Lulu"];const BOTCOL=["#64748b","#0ea5e9"];
const bots=[];
for(let i=0;i<BOTNAMES.length;i++){
  const lk={n:BOTNAMES[i],g:"m",h:"none",hc:"#000000",c:["#cbd5e1",BOTCOL[i],"#94a3b8","#475569"],a:"none",bot:true};
  const b={i,body:newBody(0,-100,0),ch:new Character(lk,"bot"),wp:0,lastWp:0,speed:6.4+i*0.5,mode:"run",chaseT:0,cd:6+i*3,rot:0,stuck:0,pause:0,active:false,choice:{}};
  b.ch.root.visible=false;bots.push(b);
}
function botWpPos(b,i){
  const w=wps[i];
  if(w.gate!==undefined){const g=gates[w.gate];let k=b.choice[w.gate];if(k===undefined||k>=g.boxes.length){k=Math.floor(Math.random()*g.boxes.length);b.choice[w.gate]=k;}
    const bx=g.boxes[k];return {x:(bx.min[0]+bx.max[0])/2,y:bx.max[1],z:(bx.min[2]+bx.max[2])/2};}
  return w;
}
function botPlaceAt(b,wi){
  wi=Math.max(0,Math.min(wps.length-1,wi));const w=botWpPos(b,wi);
  b.body=newBody(w.x+(Math.random()-0.5)*1.2,w.y+0.05,w.z+(Math.random()-0.5)*1.2);b.wp=Math.min(wps.length-1,wi+1);b.lastWp=wi;b.stuck=0;b.mode="run";
}
let botBandT=0;
function updateBots(dt){
  const want=botsOn&&playing&&me.cp>=1&&mode==="atk";
  for(const b of bots){
    if(!want){if(b.active){b.active=false;b.ch.root.visible=false;}continue;}
    if(!b.active){b.active=true;b.ch.root.visible=true;botPlaceAt(b,cpWp[Math.min(me.cp,NSTAGE)]+b.i);}
    const B=b.body;let tx,ty,tz;
    if(b.frozen>0){b.frozen-=dt;b.ch.setFx({fz:true});b.ch.animate(dt,0,true);continue;}else if(b.ch.fxM.fz)b.ch.setFx({});
    if(b.zip){const Z=zips[b.zip.i];if(Z){b.zip.t+=dt/Math.max(1,Z.len/9);const k=Math.min(1,b.zip.t);B.x=Z.x;B.z=Z.z0+0.2+(Z.z1-Z.z0-0.2)*k;B.y=Z.y0+(Z.y1-Z.y0)*k+0.1;B.vx=B.vy=B.vz=B.kx=B.kz=0;
      if(k>=1){b.zip=null;B.y=Z.y1+0.05;}b.ch.root.position.set(B.x,B.y,B.z);b.ch.animate(dt,0,false,true);continue;}b.zip=null;}
    if(b.mode==="chase"){tx=me.x;ty=me.y;tz=me.z;b.chaseT-=dt;if(b.chaseT<=0){b.mode="run";b.cd=4+Math.random()*4;}}
    else{const w=botWpPos(b,b.wp);tx=w.x;ty=w.y;tz=w.z;}
    let dx=tx-B.x,dz=tz-B.z;const h=Math.hypot(dx,dz);if(h>1e-3){dx/=h;dz/=h;}
    let jump=false,held=true,sp=b.speed;
    if(b.dizzy>0){b.dizzy-=dt;sp*=0.5;const a=Math.sin(performance.now()/380+b.speed)*1.1,c=Math.cos(a),sn=Math.sin(a),ox=dx;dx=ox*c-dz*sn;dz=ox*sn+dz*c;b.ch.setFx({dz:true});}else if(b.ch.fxM.dz)b.ch.setFx({});
    if(b.pause>0){b.pause-=dt;sp=0;}
    if(B.grounded&&sp>0){
      if(ty-B.y>0.5&&h<4.6)jump=true;
      else if(h>1.0&&!groundBelow(B.x+dx*0.8,B.y,B.z+dz*0.8))jump=true;
      if(blockAhead(B.x+dx*0.9,B.y,B.z+dz*0.9))jump=true;
      if(killNear(B.x+dx*1.1,B.y,B.z+dz*1.1)){jump=true;held=false;sp*=0.85;}
    }
    if(h<1.2&&b.mode==="run")sp*=Math.max(0.35,h/1.2);
    const steps=Math.max(1,Math.ceil(dt/(1/60)));const sdt=dt/steps;let died=false;
    for(let i=0;i<steps;i++){const r=bodyStep(B,sdt,dx,dz,jump&&i===0,held,sp);if(r.die){died=true;break;}}
    if(died||B.y<botWpPos(b,b.lastWp).y-15){botPlaceAt(b,b.lastWp);continue;}
    // bots answer quiz gates by guessing
    if(B.grounded&&B.groundBox&&B.groundBox.gate!==undefined){const gb=B.groundBox,g=gates[gb.gate];
      if(gb.k!==g.correct){let k;do{k=Math.floor(Math.random()*g.boxes.length);}while(k===gb.k);b.choice[gb.gate]=k;
        B.x=g.q.x+(b.i?1.5:-1.5);B.y=g.q.y+0.05;B.z=g.q.z;B.vx=B.vz=B.vy=0;b.ch.say("🤔");
        const gi=wps.findIndex(w=>w.gate===gb.gate);if(gi>=0){b.wp=gi;b.lastWp=gi-1;}}}
    if(b.mode==="run"&&B.grounded){const w=botWpPos(b,b.wp);
      if(Math.hypot(w.x-B.x,w.z-B.z)<1.0&&Math.abs(w.y-B.y)<0.8){b.lastWp=b.wp;b.stuck=0;if(w.zip!==undefined)b.zip={i:w.zip,t:0};
        if(b.wp>=wps.length-1){b.choice={};botPlaceAt(b,cpWp[Math.min(Math.max(me.cp,1),NSTAGE)]);continue;}
        b.wp++;if(Math.random()<0.25)b.pause=0.2+Math.random()*0.5;}}
    b.stuck+=dt;if(b.stuck>9&&b.mode==="run")botPlaceAt(b,b.wp);
    const pdx=me.x-B.x,pdz=me.z-B.z,pd=Math.hypot(pdx,pdz);
    b.cd-=dt;
    const calm=me.cp===BOULDER_STAGE||me.cp===TEACHER_STAGE||me.ride;
    if(b.mode==="run"&&b.cd<=0&&pd<8&&Math.abs(me.y-B.y)<1.2&&me.grounded&&!calm){if(Math.random()<0.5){b.mode="chase";b.chaseT=3.5;}else b.cd=2+Math.random()*3;}
    if(pd<0.95&&Math.abs(me.y-B.y)<2.2&&!me.ride&&fxState.ghost<=0){
      const nx=pd>1e-4?pdx/pd:1,nz=pd>1e-4?pdz/pd:0;
      if(b.mode==="chase"){me.kx=nx*11;me.kz=nz*11;me.vy=Math.max(me.vy,6);me.grounded=false;Snd.play("boing");toast(t("botPushed"),1100);b.mode="run";b.cd=8+Math.random()*8;b.ch.say(["😜","😈"][b.i]);}
      else{B.x-=nx*(0.95-pd)*0.5;B.z-=nz*(0.95-pd)*0.5;}
      const hs=Math.hypot(me.vx,me.vz),tow=me.vx*-nx+me.vz*-nz;
      if(hs>3&&tow>hs*0.5&&me.pushCd<=0){me.pushCd=0.8;B.kx=-nx*14;B.kz=-nz*14;B.vy=7;B.grounded=false;Snd.play("push");}
      me.x+=nx*(0.95-pd)*0.3;me.z+=nz*(0.95-pd)*0.3;
    }
    const hs=Math.hypot(B.vx,B.vz);if(hs>0.5)b.rot=lerpAngle(b.rot,Math.atan2(B.vx,B.vz),1-Math.exp(-12*dt));
    b.ch.root.position.set(B.x,B.y,B.z);b.ch.av.g.rotation.y=b.rot;b.ch.animate(dt,hs,B.grounded);
  }
  botBandT-=dt;
  if(want&&botBandT<=0){botBandT=2;
    for(const b of bots){const d=Math.hypot(b.body.x-me.x,b.body.z-me.z);
      if(d>38&&b.mode==="run"){const base=cpWp[Math.min(me.cp,NSTAGE)];
        let best=base,bd=1e9;for(let k=base;k<wps.length;k++){const dd=Math.abs(botWpPos(b,k).z-me.z);if(dd<bd){bd=dd;best=k;}}
        botPlaceAt(b,Math.max(base,best-2+b.i));}}}
}

/* ================= playground interactions ================= */
let slideCd=0;
function updateRide(dt){
  if(me.zip){const Z=zips[me.zip.i];if(!Z){me.zip=null;return false;}me.zip.t+=dt/Math.max(1,Z.len/9);const k=Math.min(1,me.zip.t);
    me.x=Z.x;me.z=Z.z0+0.2+(Z.z1-Z.z0-0.2)*k;me.y=Z.y0+(Z.y1-Z.y0)*k+0.1;me.vx=me.vy=me.vz=me.kx=me.kz=0;me.rot=0;me.grounded=false;
    if(k>=1||jumpBuf>0){me.zip=null;jumpBuf=0;me.rideCd=1;}return true;}
  if(me.ride){const s=me.ride;
    me.x=s.wx;me.y=s.wy-2.35*Math.cos(s.ang)-0.95;me.z=s.wz-2.35*Math.sin(s.ang);
    me.vx=me.vy=me.vz=me.kx=me.kz=0;me.grounded=true;me.rot=0;
    if(jumpBuf>0){jumpBuf=0;const da=s.amp*2.1*Math.cos(s.t*2.1+s.ph);
      const vz=-2.35*Math.cos(s.ang)*da;me.kz=vz*1.4;me.vy=Math.max(9,10+2.35*Math.sin(s.ang)*-da);me.grounded=false;me.y+=0.3;
      s.ride=false;me.ride=null;me.rideCd=1.2;Snd.play("whee");}
    return true;}
  me.rideCd-=dt;
  if(me.rideCd<=0&&playing&&mode==="atk")for(let i=0;i<zips.length;i++){const Z=zips[i];
    if(Math.abs(me.x-Z.x)<1.4&&me.z>Z.z0-1.8&&me.z<Z.z0+0.9&&Math.abs(me.y-Z.y0)<0.8){me.zip={i,t:0};Snd.play("whee");return true;}}
  if(me.rideCd<=0&&me.grounded&&playing)for(const s of seats){const sz=s.wz-2.35*Math.sin(s.ang);
    if(Math.hypot(me.x-s.wx,me.z-sz)<0.75&&me.y<s.by+1&&me.y>s.by-0.5){me.ride=s;s.ride=true;Snd.play("pop");break;}}
  return false;
}
function updatePlayground(dt){
  slideCd-=dt;
  const gb=me.grounded?me.groundBox:null;
  if(gb&&gb.tramp){me.vy=19;me.grounded=false;Snd.play("boing");}
  if(gb&&gb.slide){me.kz=Math.max(me.kz,9);if(slideCd<=0){Snd.play("whee");slideCd=1.5;}}
  if(gb&&gb.carousel){const a=CAR_W*dt,dx=me.x-gb.carousel.x,dz=me.z-gb.carousel.z,ca=Math.cos(a),sa=Math.sin(a);
    me.x=gb.carousel.x+dx*ca+dz*sa;me.z=gb.carousel.z-dx*sa+dz*ca;}
  for(const ss of seesaws){if(ss.cd>0)continue;for(const sg of [-1,1]){const ex=ss.x+sg*2.0;
    if(Math.abs(me.x-ex)<0.75&&Math.abs(me.z-ss.z)<0.7&&me.y<ss.y+1.4&&me.y>ss.y-0.5&&me.vy<=0.5){me.vy=17;me.kx=sg*3;me.grounded=false;ss.kick=sg<0?0.4:-0.4;ss.cd=0.7;Snd.play("boing");}}}
  for(const b of balls){
    const dx=b.x-me.x,dz=b.z-me.z,d=Math.hypot(dx,dz);
    if(d<1.05&&me.y<b.y+0.6&&me.y+2.6>b.y){const nx=d>1e-3?dx/d:0,nz=d>1e-3?dz/d:1;const sp=Math.max(6,Math.hypot(me.vx,me.vz)*1.4);
      b.vx=nx*sp;b.vz=nz*sp;b.vy=5+Math.random()*2;b.x=me.x+nx*1.06;b.z=me.z+nz*1.06;Snd.play("kick");}
    b.vy-=25*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
    if(b.y<0.55){b.y=0.55;b.vy=Math.abs(b.vy)>1.5?-b.vy*0.55:0;b.vx*=0.985;b.vz*=0.985;}
    if(b.x<-15.3||b.x>15.3){b.vx=-b.vx*0.7;b.x=Math.max(-15.3,Math.min(15.3,b.x));}
    if(b.z<-13.3){b.vz=-b.vz*0.7;b.z=-13.3;}
    if(b.z>13.3&&Math.abs(b.x)>2.3){b.vz=-b.vz*0.7;b.z=13.3;}
    if(b.z>13.6||b.y<-20){b.x=b.hx;b.z=b.hz;b.y=3;b.vx=b.vz=b.vy=0;}
    b.m.position.set(b.x,b.y,b.z);b.m.rotation.x+=b.vz*dt/0.55;b.m.rotation.z-=b.vx*dt/0.55;
  }
  for(const m of memes){
    m.cd-=dt;
    if(m.cd<=0&&Math.hypot(me.x-m.x,me.z-m.z)<m.r&&me.y<m.y+m.h){
      m.cd=3;Snd.play(m.key==="sigma"?"aura":"pop");memeSay(m,t("meme_"+m.key));
      if(!m.given){m.given=true;addPts(25);}
    }
    if(m.bub){m.bt-=dt;if(m.bt<=0){disposeSprite(m.bub);m.bub=null;}}
  }
  for(const c of coins){if(c.got)continue;c.m.rotation.z+=dt*3;
    if(Math.abs(me.x-c.x)<1.0&&Math.abs(me.z-c.z)<1.0&&me.y<c.y+0.6&&me.y+2.7>c.y){c.got=true;c.m.visible=false;Snd.play("coin");addPts(10);}}
}
function memeSay(m,text){disposeSprite(m.bub);m.bub=makeTextSprite(text,{bubble:true});m.bub.position.set(m.x,m.y+m.h+0.8,m.z);scene.add(m.bub);m.bt=3;}

/* ================= input ================= */
const keys={};let jumpBuf=0,touchJump=false;
function jumpHeld(){return keys.Space||touchJump;}
addEventListener("keydown",e=>{
  if(document.activeElement&&document.activeElement.tagName==="INPUT")return;
  if(e.code==="KeyM"){toggleMusic();return;}
  if(e.code==="Escape"&&!$("chatRow").classList.contains("hidden")){$("chatRow").classList.add("hidden");return;}
  if(e.code==="KeyP"||e.code==="Escape"){if(playing||paused)setPause(!paused);return;}
  if(!playing||paused)return;
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();

function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.life-=dt;
    if(p.ty==="choc"){let best=null,bd=25;
      const consider=(x,y,z,key)=>{if(key===p.owner)return;const d=Math.hypot(x-p.x,z-p.z);if(d<bd&&Math.abs(y+1.4-p.y)<6){bd=d;best={x,z};}};
      if(p.owner!=="me")consider(me.x,me.y,me.z,"me");
      for(const [peer,r] of remotes)consider(r.x,r.y,r.z,peer);
      if(p.owner==="me")for(const b of bots)if(b.active)consider(b.body.x,b.body.y,b.body.z,"bot");
      if(best){const cur=Math.atan2(p.vx,p.vz),want=Math.atan2(best.x-p.x,best.z-p.z);const nw=lerpAngle(cur,want,Math.min(1,dt*1.6));p.vx=Math.sin(nw)*15;p.vz=Math.cos(nw)*15;}}
    p.x+=p.vx*dt;p.z+=p.vz*dt;p.m.position.set(p.x,p.y,p.z);p.m.rotation.y=Math.atan2(p.vx,p.vz);if(p.ty==="choc")p.m.rotation.z+=dt*6;

    const near2=(x,y,z)=>Math.hypot(x-p.x,z-p.z)<1.4&&p.y>y-0.6&&p.y<y+3.3;
    if(p.owner==="me"){
      for(const [peer,r] of remotes){if(near2(r.x,r.y,r.z)){sendAttack([{to:peer,ty:p.ty,x:r2(nx),z:r2(nz)}]);hit=true;break;}}

    }else{if(near2(me.x,me.y,me.z))hit=true;for(const [peer,r] of remotes){if(peer!==p.owner&&near2(r.x,r.y,r.z))hit=true;}}

    if(hit||p.life<=0){scene.remove(p.m);projs.splice(i,1);}
  }
}

function updateRival(B,dt){

    B.think-=dt;
    if(B.think<=0){const u=B.u;const others=[0,1,2,3].filter(k=>k!==u.correct&&!B.tried.includes(k));

    const s=Math.min(along/(L/R),across/XR);if(!best||s>best.s)best={R,s};}
  const R=best.R,s=best.s,seg=L/R,band=((land?H:W)-pad*2)/R;

function edInit(){
  const cv=$("edCv");
  cv.addEventListener("pointerdown",e=>{if(!edM)return;const r=cv.getBoundingClientRect();const h=edHit(e.clientX-r.left,e.clientY-r.top);if(!h)return;
    edDrag=Object.assign(h,{px:e.clientX-r.left,py:e.clientY-r.top,moved:false});edSel=h.kind==="seg"?{seg:h.seg}:null;try{cv.setPointerCapture(e.pointerId);}catch(_){}edRedraw();});
  cv.addEventListener("pointermove",e=>{if(!edDrag)return;const r=cv.getBoundingClientRect();edDrag.px=e.clientX-r.left;edDrag.py=e.clientY-r.top;edDrag.moved=true;edRedraw();});
  cv.addEventListener("pointerup",e=>{if(!edDrag)return;const d=edDrag;edDrag=null;if(d.moved){edPush();if(edDrop(d,d.px,d.py)){Snd.play("click");edApply();}else{edUndo.pop();edRedraw();}}else edRedraw();});
  $("edUndo").onclick=()=>{if(!edUndo.length)return;edSpec=JSON.parse(edUndo.pop());edTexts();edApply();};
  $("edRand").onclick=()=>{edPush();edRandom();edTexts();edApply();};
  $("edReset").onclick=()=>{edPush();edSpec=defaultSpec();edTexts();edApply();};
  $("edCancel").onclick=()=>{$("edOv").classList.add("hidden");rebuildLevel(edOrig);};
  $("edOk").onclick=()=>{$("edOv").classList.add("hidden");const cb=edDone;edDone=null;if(cb)cb();};
  addEventListener("resize",()=>{if(!$("edOv").classList.contains("hidden"))edRedraw();});
}
if(EDITOR)edInit();

/* ================= main loop ================= */
let last=performance.now(),themeIdx=0,tmAcc=0;const tmpC=new THREE.Color();
function currentTheme(z){let s=0;for(let i=1;i<stageZ.length;i++)if(z>=stageZ[i]-3)s=i;if(z>cps[cps.length-1].z-6)s=NSTAGE;return s;}
function lerpAngle(a,b,k){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k;}
function setPause(v){
  if(v===paused)return;
  if(v){if(!playing)return;paused=true;pauseT0=performance.now();for(const k in keys)keys[k]=false;$("pausePts").textContent="⭐ "+pts+" "+t("pts");$("pause").classList.remove("hidden");Snd.rumble(false);}
  else{paused=false;if(startT)startT+=performance.now()-pauseT0;last=performance.now();$("pause").classList.add("hidden");if(boulder.state==="roll")Snd.rumble(true);}
}
function frame(now){
  requestAnimationFrame(frame);
  if(paused){renderer.render(scene,camera);return;}
  const dt=Math.min(0.05,(now-last)/1000);last=now;tmAcc+=dt;
  if(playing&&startT&&!me.won)elapsed=(now-startT)/1000;
  let iv=(playing&&fxState.frozen<=0)?inputVec():{x:0,z:0};
  if(fxState.dizzy>0&&(iv.x||iv.z)){const a=Math.sin(performance.now()/380)*1.1,c=Math.cos(a),sn=Math.sin(a);iv={x:(iv.x*c-iv.z*sn)*0.6,z:(iv.x*sn+iv.z*c)*0.6};}
  if(fxState.frozen>0)jumpBuf=0;
  if(jumpBuf>0)jumpBuf-=dt;
  const riding=updateRide(dt);
  let died=false;
  if(!riding){
    const steps=Math.ceil(dt/(1/120));const sdt=dt/steps;
    for(let i=0;i<steps;i++){
      const r=bodyStep(me,sdt,iv.x,iv.z,playing&&jumpBuf>0,jumpHeld(),isTouch?SPEED*1.1:SPEED);
      if(r.jumped){jumpBuf=0;Snd.play("jump");}
      if(r.die){die();died=true;break;}
      if(r.landed&&r.impact<-14)Snd.play("land");
      bootsFloor();
    }
    if(me.grounded&&me.groundBox&&me.groundBox.gate===undefined&&!killNear(me.x,me.y,me.z))me.lastSafe={x:me.x,y:me.y,z:me.z};
    if(mode==="atk"&&!died&&me.y<Math.min(cps[me.cp].y,me.lastSafe?me.lastSafe.y:1e9)-15)die();
    if(mode==="atk"&&me.grounded&&me.groundBox){const gb=me.groundBox;
      if(gb.type==="cp"&&gb.cp>me.cp)reachCp(gb.cp);
      if(gb.gate!==undefined&&playing)checkGate(gb);
      if(gb.type==="win"&&!me.won){me.won=true;me.winTime=startT?elapsed:0;addPts(500);showWin();sendState(true);}}
    if(playing)updatePlayground(dt);
  }
  const hs=riding?0:Math.hypot(me.vx,me.vz);
  if(hs>0.5)me.rot=lerpAngle(me.rot,Math.atan2(me.vx+me.kx,me.vz+me.kz),1-Math.exp(-14*dt));
  meChar.root.position.set(me.x,me.y,me.z);meChar.av.g.rotation.y=me.rot;meChar.animate(dt,hs,me.grounded,riding);
  me.pushCd-=dt;
  for(const [id,r] of remotes){
    const k=1-Math.exp(-12*dt);const ox=r.x,oz=r.z;
    r.x+=(r.tx-r.x)*k;r.y+=(r.ty-r.y)*k;r.z+=(r.tz-r.z)*k;
    if(Math.hypot(r.tx-r.x,r.tz-r.z)>12){r.x=r.tx;r.y=r.ty;r.z=r.tz;}
    r.rot=lerpAngle(r.rot,r.trot,k);r.spd=r.spd*0.8+0.2*(Math.hypot(r.x-ox,r.z-oz)/Math.max(dt,1e-3));
    r.ch.root.position.set(r.x,r.y,r.z);r.ch.av.g.rotation.y=r.rot;r.ch.animate(dt,r.spd,!!r.g,!!r.sit);
    r.ch.root.visible=(r.md||"atk")===mode;
    if(playing&&!riding&&r.ch.root.visible){const dx=me.x-r.x,dz=me.z-r.z,d=Math.hypot(dx,dz);
      if(d<0.95&&Math.abs(me.y-r.y)<2.4){const nx=d>1e-4?dx/d:1,nz=d>1e-4?dz/d:0;
        me.x+=nx*(0.95-d)*0.5;me.z+=nz*(0.95-d)*0.5;
        const toward=-(me.vx*nx+me.vz*nz);
        if(mode==="atk"&&hs>3&&toward>hs*0.5&&me.pushCd<=0){me.pushCd=0.8;sendPush(id,-nx,-nz);toast(t("push"),700);Snd.play("push");}}}
  }
  updateBots(dt);updateTab(dt);
  for(const fn of animated)fn(tmAcc,dt);
  updateBoxes(dt,now);updateParts(dt);updateFx(dt);updateProjs(dt);for(const bt of belts)bt.tx.offset.y-=bt.v*dt*0.5;meChar.setPts(pts);
  const inMenu=!playing&&!$("menu").classList.contains("hidden");
  camTarget.lerp(tmpV.set(me.x,me.y+2.2,me.z),1-Math.exp(-10*dt));
  let cyw=yaw,cpt=pitch,cd=dist;
  if(inMenu){cyw=Math.sin(now*0.0004)*0.8;cpt=0.3;cd=9;camTarget.set(me.x,me.y+1.8,me.z);meChar.av.g.rotation.y=0;}
  if(inMenu&&innerWidth>=900)camera.setViewOffset(innerWidth,innerHeight,-innerWidth*0.2,0,innerWidth,innerHeight);
  else if(camera.view&&camera.view.enabled)camera.clearViewOffset();
  camera.position.set(camTarget.x+Math.sin(cyw)*Math.cos(cpt)*cd,camTarget.y+Math.sin(cpt)*cd,camTarget.z+Math.cos(cyw)*Math.cos(cpt)*cd);
  camera.lookAt(camTarget);
  const flyP=fly.on?flyStep(dt):null;
  updateBoulder(dt);updateTeacher(dt);
  themeIdx=mode==="tab"?0:currentTheme(flyP?flyP.z:me.z);const th=stageTh[themeIdx]||THEMES.playground;const tk=1-Math.exp(-2*dt);
  scene.background.lerp(tmpC.set(th.bg),tk);scene.fog.color.lerp(tmpC.set(th.fog),tk);hemi.intensity+=(th.hemi-hemi.intensity)*tk;
  Snd.setSong(playing?(mode==="tab"?"rock":th.song):"happy");
  KILL_MAT.emissiveIntensity=0.45+Math.sin(now*0.006)*0.25;
  if(winTrophy)winTrophy.rotation.y+=dt*1.2;
  {const F=flyP||me;sun.position.set(F.x+18,F.y+40,F.z+(inMenu?14:-12));sun.target.position.set(F.x,F.y,F.z);}
  if(playing){
    $("stageLbl").textContent=mode==="tab"?tabLabel():me.cp===0?("🎓 "+t("tutorial")):(t("stage")+" "+me.cp+"/"+NSTAGE+" · "+thName(stageKey[Math.max(1,themeIdx)]));
    $("timerLbl").textContent="⏱ "+(startT?fmtTime(me.won?me.winTime:elapsed):"--");
    $("ptsLbl").textContent="⭐ "+pts;
  }
  boardT-=dt;if(boardT<=0){boardT=0.3;renderBoard();}
  sendState(false);
  renderer.render(scene,camera);
  if(inMenu&&pvAv){pvAv.g.rotation.y=Math.sin(now*0.0011)*0.7;pvR.render(pvScene,pvCam);}
}
addEventListener("resize",resize);resize();
buildMenu();refreshPreview();renderInv();
camTarget.set(me.x,me.y+2,me.z);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{meChar.setLook(look);signs.forEach(drawSign);gates.forEach(drawGate);});
requestAnimationFrame(frame);
})();
</script>
</body>
